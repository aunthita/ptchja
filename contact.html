<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — [ชื่อธุรกิจ]</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
  <a href="index.html" class="logo">[ชื่อธุรกิจ]<span>.</span></a>

  <button class="menu-toggle">☰</button>

  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="work.html">Work</a>
    <a href="process.html">Process</a>
    <a href="contact.html" class="nav-cta active">Let's Talk ↗</a>
  </nav>
</header>

<main>

  <section class="contact-hero">
    <div>
      <p class="eyebrow">CONTACT US</p>

      <h1>
        Let's create<br>
        <span>something</span><br>
        memorable.
      </h1>

      <p>
        มีโปรเจกต์ในใจแล้วใช่ไหม?
        ส่งรายละเอียดมาให้เรา แล้วมาคุยกัน
      </p>

      <div class="contact-links">
        <a href="mailto:hello@example.com">hello@example.com ↗</a>
        <a href="tel:+66000000000">+66 00 000 0000</a>
      </div>
    </div>

    <form class="contact-form">

      <label>
        Name
        <input type="text" placeholder="Your name" required>
      </label>

      <label>
        Email
        <input type="email" placeholder="you@example.com" required>
      </label>

      <label>
        Project Type
        <select>
          <option>Branding</option>
          <option>Web Design</option>
          <option>Creative Campaign</option>
          <option>Other</option>
        </select>
      </label>

      <label>
        Tell us about your project
        <textarea rows="5" placeholder="What's on your mind?"></textarea>
      </label>

      <button type="submit" class="btn btn-dark">
        Send Message ↗
      </button>

      <p class="form-message"></p>

    </form>
  </section>

</main>

<footer>
  <div class="footer-logo">[ชื่อธุรกิจ]<span>.</span></div>
  <p>© 2026 [ชื่อธุรกิจ]. All rights reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
